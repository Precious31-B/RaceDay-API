name: CI/CD Pipeline - Part 3

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x' 

    - name: Restore API
      run: dotnet restore RaceDay.API/RaceDay.API.csproj

    - name: Restore Tests
      run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

    - name: Restore MVC Web
      run: dotnet restore RaceDay.Web/RaceDay.Web.csproj

    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    - name: Build MVC Web
      run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj
